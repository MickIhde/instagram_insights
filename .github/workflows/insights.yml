name: Instagram Insights

on:
  schedule:
    - cron: "17 4 * * 1"   # montags, ca. 05:17 / 06:17 Berliner Zeit
  workflow_dispatch: {}     # manuell startbar (Actions -> Run workflow)

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Insights abrufen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/fetch_insights.py

      - name: Aenderungen committen
        run: |
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "data: Instagram-Insights $(date -u +%F)"
            git push
          fi
